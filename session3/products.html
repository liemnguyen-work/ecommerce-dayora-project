<body class="product-list-page">
    <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="DAYORA - Trang chủ"><img src="images/logo.png" alt=""><span>DAYORA</span></a>
      <nav aria-label="Điều hướng chính">

        <a href="products.html" aria-current="page">Sản phẩm</a>

      </nav>
      <div class="search-box">
        <label class="home-search-label" for="search">Tìm kiếm sản phẩm</label>
        <input id="search" type="search" placeholder="Tìm sản phẩm">
      </div>
    </div>

  <main class="products-page">

      <div class="filter-toolbar" aria-label="Bộ lọc sản phẩm">
  <div class="filter-group">
    <label for="filter-search" class="filter-label">Tìm kiếm</label>
    <input type="search" id="filter-search" class="filter-input" placeholder="Tìm theo tên sản phẩm...">
  </div>
  <div class="filter-group">
    <label for="filter-category" class="filter-label">Danh mục</label>
    <select id="filter-category" class="filter-select">
      <option value="">Tất cả danh mục</option>
    </select>
  </div>
  <div class="filter-group">
    <label for="filter-sort" class="filter-label">Sắp xếp</label>
    <select id="filter-sort" class="filter-select">
      <option value="default">Mặc định</option>
      <option value="price-asc">Giá: Thấp đến Cao</option>
      <option value="price-desc">Giá: Cao đến Thấp</option>
    </select>
  </div>
</div>
      <ul class="product-grid">
      </ul>
    </section>
  </main>

  <footer class="site-footer">

    </div>
